<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5f9341">
    <meta name="description" content="A fast mobile app to save, track and manage your important links. Developed by Inga Maholwana.">
    <meta name="keywords" content="leads tracker, bookmark manager, link saver, mobile web app, Inga Maholwana">
    <meta name="author" content="Inga Maholwana">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Leads Tracker Mobile">
    <meta property="og:description" content="Save and manage your important web links, with optional account-based sync across devices.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ingamaholwana.github.io/PORTFOLIOWEBSITE/">

    <!-- Browser tab and home-screen icons -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">

    <link rel="stylesheet" href="./index.css">
    <title>Leads Tracker | Save & Manage Links</title>
</head>
<body>
    <main>
        <h1 class="visually-hidden">Leads Tracker</h1>

        <section aria-label="Save a lead">
            <label for="input-el">Enter URL:</label>
            <input
                type="text"
                id="input-el"
                name="url-input"
                placeholder="https://github.com/IngaMaholwana"
                autocomplete="url"
                inputmode="url"
            >
            <button id="input-btn" type="button">SAVE INPUT</button>
            <button id="delete-btn" type="button" title="Double-click to delete all saved leads">DELETE ALL</button>
            <p id="app-status" class="status-message" role="status" aria-live="polite"></p>
        </section>

        <div id="empty-state" class="empty-state hidden">
            <span class="empty-icon" aria-hidden="true">↗</span>
            <p>No leads yet</p>
            <p class="small">Add a URL above to get started</p>
        </div>

        <ul id="ul-el" aria-label="Saved leads"></ul>

        <section class="account-panel" aria-labelledby="account-heading">
            <h2 id="account-heading">Sync across devices</h2>
            <p class="account-intro">Create an account or sign in on each device to access the same saved leads.</p>

            <div id="auth-forms">
                <label for="auth-email">Email address:</label>
                <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com">

                <label for="auth-password">Password:</label>
                <input type="password" id="auth-password" autocomplete="current-password" placeholder="At least 6 characters">

                <div class="auth-actions">
                    <button id="sign-in-btn" type="button">SIGN IN</button>
                    <button id="sign-up-btn" class="secondary-btn" type="button">CREATE ACCOUNT</button>
                </div>
            </div>

            <div id="signed-in-panel" class="hidden">
                <p class="signed-in-copy">Signed in as <strong id="user-email"></strong></p>
                <button id="import-local-btn" class="secondary-btn hidden" type="button">IMPORT THIS DEVICE'S LEADS</button>
                <button id="sign-out-btn" type="button">SIGN OUT</button>
            </div>

            <p id="account-status" class="status-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="dev-footer">
        <p class="dev-name">Developed by <strong>Inga Maholwana</strong></p>
        <div class="dev-socials">
            <a href="https://ingamaholwana.github.io/PORTFOLIOWEBSITE/" target="_blank" rel="noopener noreferrer">Portfolio</a> •
            <a href="https://github.com/IngaMaholwana" target="_blank" rel="noopener noreferrer">GitHub</a> •
            <a href="https://www.linkedin.com/in/inga-maholwana/" target="_blank" rel="noopener noreferrer">LinkedIn</a> •
            <a href="https://www.youtube.com/@ingamaholwana2447" target="_blank" rel="noopener noreferrer">YouTube</a>
        </div>
    </footer>

    <script type="module" src="./index.js"></script>
</body>
</html>
